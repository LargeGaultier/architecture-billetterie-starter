x-db: &db
  image: postgres:16-alpine
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
    interval: 2s
    timeout: 2s
    retries: 20

x-runtime: &runtime
  build:
    context: .
    target: runtime
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 2s
    timeout: 2s
    retries: 30

services:
  identity-db:
    <<: *db
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity_local
      POSTGRES_DB: identity
    volumes: [tp7_identity_data:/var/lib/postgresql/data]
    networks: [identity-data]

  ticketing-db:
    <<: *db
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing_local
      POSTGRES_DB: ticketing
    volumes: [tp7_ticketing_data:/var/lib/postgresql/data]
    networks: [ticketing-data]

  payments-db:
    <<: *db
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments_local
      POSTGRES_DB: payments
    volumes: [tp7_payments_data:/var/lib/postgresql/data]
    networks: [payments-data]

  identity:
    <<: *runtime
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/services/identity.js"]
    environment:
      SERVICE_NAME: identity
      DATABASE_URL: postgres://identity:identity_local@identity-db:5432/identity
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    depends_on:
      identity-db:
        condition: service_healthy
    networks: [public-api, identity-data]

  ticketing:
    <<: *runtime
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/services/ticketing.js"]
    environment:
      SERVICE_NAME: ticketing
      DATABASE_URL: postgres://ticketing:ticketing_local@ticketing-db:5432/ticketing
      IDENTITY_URL: http://identity:3000
      PAYMENTS_URL: http://payments:3000
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:-tp7-local-service-token-rotate-outside-demo}
      IDENTITY_TIMEOUT_MS: ${IDENTITY_TIMEOUT_MS:-1000}
      PAYMENTS_TIMEOUT_MS: ${PAYMENTS_TIMEOUT_MS:-3500}
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
      LAB_RESERVATION_PAUSE_MS: ${LAB_RESERVATION_PAUSE_MS:-75}
    depends_on:
      ticketing-db:
        condition: service_healthy
    networks: [public-api, ticketing-data, payments-rpc]

  payments:
    <<: *runtime
    command: ["sh", "-c", "node dist/migrate.js && exec node dist/services/payments.js"]
    environment:
      SERVICE_NAME: payments
      DATABASE_URL: postgres://payments:payments_local@payments-db:5432/payments
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:-tp7-local-service-token-rotate-outside-demo}
      PAYMENT_SLOW_MS: ${PAYMENT_SLOW_MS:-2000}
    depends_on:
      payments-db:
        condition: service_healthy
    networks: [payments-rpc, payments-data]

  gateway:
    <<: *runtime
    environment:
      IDENTITY_URL: http://identity:3000
      TICKETING_URL: http://ticketing:3000
      GATEWAY_TIMEOUT_MS: ${GATEWAY_TIMEOUT_MS:-10000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      identity:
        condition: service_healthy
      ticketing:
        condition: service_healthy
      payments:
        condition: service_healthy
    networks: [public-api]

  identity-db-test:
    <<: *db
    profiles: [test]
    environment:
      POSTGRES_USER: identity_test
      POSTGRES_PASSWORD: identity_test
      POSTGRES_DB: identity_test
    networks: [test-data]

  ticketing-db-test:
    <<: *db
    profiles: [test]
    environment:
      POSTGRES_USER: ticketing_test
      POSTGRES_PASSWORD: ticketing_test
      POSTGRES_DB: ticketing_test
    networks: [test-data]

  payments-db-test:
    <<: *db
    profiles: [test]
    environment:
      POSTGRES_USER: payments_test
      POSTGRES_PASSWORD: payments_test
      POSTGRES_DB: payments_test
    networks: [test-data]

  test:
    build:
      context: .
      target: build
    profiles: [test]
    environment:
      DATABASE_URL: postgres://ticketing_test:ticketing_test@ticketing-db-test:5432/ticketing_test
      IDENTITY_DATABASE_URL: postgres://identity_test:identity_test@identity-db-test:5432/identity_test
      PAYMENTS_DATABASE_URL: postgres://payments_test:payments_test@payments-db-test:5432/payments_test
    command: ["sh", "-c", "npm run migrate:test && npm run check:architecture && npm test"]
    depends_on:
      identity-db-test:
        condition: service_healthy
      ticketing-db-test:
        condition: service_healthy
      payments-db-test:
        condition: service_healthy
    networks: [test-data]

  load:
    build:
      context: .
      target: build
    profiles: [load]
    environment:
      BASE_URL: http://gateway:3000
      EVENT_ID: ${EVENT_ID:-festival-lumieres}
      LOAD_SECONDS: ${LOAD_SECONDS:-10}
      LOAD_CONCURRENCY: ${LOAD_CONCURRENCY:-10}
    command: ["node", "scripts/load.mjs"]
    depends_on:
      gateway:
        condition: service_healthy
    networks: [public-api]

volumes:
  tp7_identity_data:
  tp7_ticketing_data:
  tp7_payments_data:

networks:
  public-api:
  identity-data:
    internal: true
  ticketing-data:
    internal: true
  payments-rpc:
    internal: true
  payments-data:
    internal: true
  test-data:
    internal: true
